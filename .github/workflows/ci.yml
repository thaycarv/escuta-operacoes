name: Validacao CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar sintaxe e higiene
        run: |
          node --check app.js
          node --check data.js
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            import { cloneInitialState, calculateMetrics } from "./data.js";

            const state = cloneInitialState();
            assert.ok(Array.isArray(state.cases) && state.cases.length > 0, "Casos iniciais devem existir");
            const metrics = calculateMetrics(state.cases);
            assert.equal(metrics.total, state.cases.length);

            for (const file of ["index.html", "styles.css", "app.js", "data.js", "README.md"]) {
              const content = fs.readFileSync(file, "utf8");
              assert.ok(!/[\u2013\u2014]/.test(content), `Travessao encontrado em ${file}`);
            }
          '
